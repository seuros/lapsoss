[workspace]
members = ["ext/lapsoss_native/core", "ext/lapsoss_native/ffi", "daemon"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/seuros/lapsoss"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23.1"
chrono-machines = "0.9.0"
flate2 = "1"
httpdate = "1"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
magnus = "0.9"
rama = { version = "0.4.0", features = ["http-backend", "tcp", "dns", "rustls", "ring"] }
rb-sys = "0.9.130"
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
throttle-machines = "0.3.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3"
url = "2.5.8"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
