name: Client and daemon release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing the daemon split
        required: true
        type: string

permissions:
  contents: write

jobs:
  native:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: bundle exec rake daemon:build
      - run: LAPSOSSD_TEST_BIN="$PWD/target/release/lapsossd" bundle exec rake test_daemon
      - uses: actions/upload-artifact@v7
        with:
          name: gem-daemon-${{ matrix.runner }}
          path: pkg/lapsossd-*.gem
          if-no-files-found: error

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem build lapsoss.gemspec --output lapsoss.gem
      - uses: actions/upload-artifact@v7
        with:
          name: gem-source
          path: lapsoss.gem
          if-no-files-found: error

  attach:
    needs: [native, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gem-*
          merge-multiple: true
          path: pkg
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" pkg/*.gem --repo "$GITHUB_REPOSITORY" --clobber
